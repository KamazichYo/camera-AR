<!doctype html><body><script type="module">
// Прогон кадров сцены через воркер трекера. Параметры: ?scene=main&full=0
const P = new URLSearchParams(location.search);
const scene = P.get('scene') || 'main';
const CV = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js';
const base = `/t/.data/${scene}`;
const gt = await (await fetch(`${base}/gt.json`)).json();
const w = new Worker('/app/js/tracker.worker.js');
let id = 0; const pend = new Map();
w.onmessage = (e) => { const p = pend.get(e.data.id); pend.delete(e.data.id); e.data.type === 'error' ? p.rej(new Error(e.data.message)) : p.res(e.data); };
const call = (m, tr = []) => new Promise((res, rej) => { const i = ++id; pend.set(i, { res, rej }); w.postMessage({ ...m, id: i }, tr); });
const c = document.createElement('canvas'); c.width = 640; c.height = 360;
const ctx = c.getContext('2d', { willReadFrequently: true });
async function frame(t) {
  const img = new Image(); img.src = `${base}/frames/f${String(t).padStart(3, '0')}.png`; await img.decode();
  ctx.drawImage(img, 0, 0); return ctx.getImageData(0, 0, 640, 360).data.buffer;
}
const ap = (H, [x, y]) => { const w = H[6] * x + H[7] * y + H[8]; return [(H[0] * x + H[1] * y + H[2]) / w, (H[3] * x + H[4] * y + H[5]) / w]; };
try {
  await call({ type: 'init', urls: [CV] });
  if (P.get('cfg')) await call({ type: 'debugCfg', ...JSON.parse(P.get('cfg')) });
  let buf = await frame(0);
  const det = await call({ type: 'detect', buf, w: 640, h: 360 }, [buf]);
  const q0 = gt[0].q;
  buf = await frame(0);
  const lock = await call({ type: 'lock', buf, w: 640, h: 360, quad: q0, fullFrame: P.get('full') === '1' }, [buf]);
  const rows = [];
  for (let t = 1; t < gt.length; t++) {
    buf = await frame(t);
    const r = await call({ type: 'frame', buf, w: 640, h: 360 }, [buf]);
    const q = q0.map((p) => ap(r.H, p));
    const err = q.reduce((s, p, i) => s + Math.hypot(p[0] - gt[t].q[i][0], p[1] - gt[t].q[i][1]), 0) / 4;
    rows.push({ t, state: r.state, err: +err.toFixed(2), ms: r.ms, prof: r.prof, pts: r.points, inl: r.inliers, ref: r.refined, edges: r.edges, kf: r.keyframes, src: r.source, covered: gt[t].covered, env: r.dbgEnv, sbi: r.sbi, sbiRaw: r.sbiRaw });
  }
  window.result = { det: det.quad, gt0: q0, lock, rows };
} catch (e) { window.result = { error: String(e && e.message || e) }; }
</script>
