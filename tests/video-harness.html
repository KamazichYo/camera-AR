<!doctype html><body><script type="module">
// Прогон реального видео (кадры tests/.data/video/fNNN.png) через воркер так, как это делает приложение:
// живой выбор углов касаниями → автостарт трекинга холста. Параметры: ?taps=[{f:кадр,p:[x,y]},...]&step=1
const P = new URLSearchParams(location.search);
const CV = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js';
const taps = JSON.parse(P.get('taps') || '[]');
const anchors = JSON.parse(P.get('anchors') || '[]'); // [{f:кадр, p:[x,y]}] — точки опоры после старта
const step = +(P.get('step') || 1), N = +(P.get('n') || 161);
const dir = P.get('dir') || '/t/.data/video';
const w = new Worker('/app/js/tracker.worker.js');
let id = 0; const pend = new Map();
w.onmessage = (e) => { const p = pend.get(e.data.id); pend.delete(e.data.id); e.data.type === 'error' ? p.rej(new Error(e.data.message)) : p.res(e.data); };
const c = document.createElement('canvas'); const ctx = c.getContext('2d', { willReadFrequently: true });
const call = (m, extra = {}) => new Promise((res, rej) => { const i = ++id; pend.set(i, { res, rej }); w.postMessage({ ...m, ...extra, id: i }, extra.buf ? [extra.buf] : []); });
async function frame(t) {
  const img = new Image(); img.src = `${dir}/f${String(t).padStart(3, '0')}.png`; await img.decode();
  c.width = img.width; c.height = img.height; ctx.drawImage(img, 0, 0);
  return { buf: ctx.getImageData(0, 0, c.width, c.height).data.buffer, w: c.width, h: c.height };
}
const ap = (H, [x, y]) => { const k = H[6] * x + H[7] * y + H[8]; return [(H[0] * x + H[1] * y + H[2]) / k, (H[3] * x + H[4] * y + H[5]) / k]; };
try {
  await call({ type: 'init', urls: [CV] });
  const out = [];
  let quad0 = null, mode = 'sel';
  if (P.get('dbg')) await call({ type: 'debugPts' });
  if (P.get('cfg')) await call({ type: 'debugCfg', ...JSON.parse(P.get('cfg')) }); // подмена параметров трекера: {cfg:{…}, ecc:{…}}
  // облегчённый режим включается по времени кадра — зависит от скорости машины; без явной просьбы теста он выключен
  if (!P.get('slow') && !(P.get('cfg') || '').includes('liteMs')) await call({ type: 'debugCfg', cfg: { liteMs: 1e9 } });
  if (P.get('slow')) await call({ type: 'debugMinMs', ms: +P.get('slow') }); // имитация медленного телефона: каждый кадр не быстрее N мс
  await call({ type: 'selStart' }, await frame(1));
  let ti = 0;
  for (let t = 1; t <= N; t += step) {
    const f = await frame(t);
    const t0 = performance.now();
    let row = { t };
    if (ti < taps.length && taps[ti].f <= t) {
      const r = await call({ type: 'selTap', clock: t * 33.3, point: taps[ti].p, fullFrame: P.get('full') === '1', noAuto: P.get('noauto') === '1' }, f);
      ti++;
      row.tap = { snapped: r.snapped, p: r.p };
      if (r.type === 'locked') { mode = 'track'; quad0 = r.quad; row.locked = { quad: r.quad, points: r.points, edges: r.edges, weak: r.weak, eccStd: r.eccStd, chroma: r.chromaShift, chromaEdges: r.chromaEdges }; }
      else row.pts = r.pts;
    } else if (mode === 'sel') {
      const r = await call({ type: 'frame', clock: t * 33.3 }, f);
      row.pts = r.pts;
    } else {
      if (mode === 'track') while (anchors.length && anchors[0].f <= t) { const a = anchors.shift(); row.anchor = (await call({ type: 'addAnchor', point: a.p })).n; }
      const r = await call({ type: 'frame', clock: t * 33.3 }, f);
      row.state = r.state; row.ms = r.ms; row.src = r.source; row.ecc = r.ecc; row.pts = undefined; row.nl = r.points; row.rf = r.refined; row.prof = r.prof; row.edges = r.edges; row.inl = r.inliers; row.rms = r.rms; row.dbg = r.dbgPts; row.env = r.dbgEnv; row.sbi = r.sbi; row.sup = r.dbgSup; row.ej = r.dbgEdges; row.lkq = r.dbgLk; row.ep = r.dbgEdgePts; row.supN = r.sup; row.sbiRaw = r.sbiRaw; row.anchors = r.anchors;
      row.quad = r.H && quad0 ? quad0.map((q) => ap(r.H, q)) : null;
    }
    row.dt = Math.round(performance.now() - t0);
    out.push(row);
  }
  window.result = { rows: out };
} catch (e) { window.result = { error: String(e && e.message || e) }; }
</script>
